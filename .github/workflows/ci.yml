name: AnySave CI

on:
  push:
    branches: [ main, "phase-*" ]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Linux: Go unit & race tests (engine, torture server, updater) + Android
  # ---------------------------------------------------------------------------
  linux-and-android:
    name: Linux (Go Race Tests + Android Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: host-go/go.mod

      - name: Go vet (Linux, macOS, Windows targets) & race tests
        working-directory: host-go
        run: |
          go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test -race -v ./...

      - name: Set up JDK 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Android Release APK (R8)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/

  # ---------------------------------------------------------------------------
  # 2. Windows: Real install.ps1 test, registry check, busy check, helper E2E
  # ---------------------------------------------------------------------------
  windows-installer-and-helper:
    name: Windows (Real Installer + Helper E2E)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: host-go/go.mod

      - name: Build Windows helper & run unit tests
        working-directory: host-go
        shell: pwsh
        run: |
          go vet ./...
          go test -v ./...
          New-Item -ItemType Directory -Force -Path ../dist/AnySave-windows/helper | Out-Null
          go build -trimpath -ldflags "-s -w" -o ../dist/AnySave-windows/helper/anysave-host.exe .
          Copy-Item -Recurse ../extension ../dist/AnySave-windows/extension
          Copy-Item ../installers/windows/install.ps1 ../dist/AnySave-windows/install.ps1
          Copy-Item "../installers/windows/Install AnySave.bat" "../dist/AnySave-windows/Install AnySave.bat"
          Copy-Item ../installers/windows/uninstall.ps1 ../dist/AnySave-windows/uninstall.ps1

      - name: Run Windows install.ps1 for real & verify installation
        shell: pwsh
        env:
          ANYSAVE_NO_OPEN: "1"
        run: |
          & ./dist/AnySave-windows/install.ps1
          $App = Join-Path $env:LOCALAPPDATA 'AnySave'
          $Bin = Join-Path $App 'bin'
          $Ext = Join-Path $env:USERPROFILE 'AnySave\extension'

          foreach ($f in @(
            (Join-Path $App 'anysave-host.exe'),
            (Join-Path $App 'AnySave.exe'),
            (Join-Path $App 'com.anysave.host.json'),
            (Join-Path $Bin 'yt-dlp.exe'),
            (Join-Path $Bin 'ffmpeg.exe'),
            (Join-Path $Bin 'deno.exe'),
            (Join-Path $Bin 'whisper\whisper-cli.exe'),
            (Join-Path $Ext 'manifest.json')
          )) {
            if (-not (Test-Path $f)) { throw "Missing installed file: $f" }
          }

          # Verify registry keys for Chrome, Edge, Brave, Chromium
          foreach ($r in @(
            'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.anysave.host',
            'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.anysave.host',
            'HKCU:\Software\BraveSoftware\Brave-Browser\NativeMessagingHosts\com.anysave.host',
            'HKCU:\Software\Chromium\NativeMessagingHosts\com.anysave.host'
          )) {
            $val = (Get-ItemProperty -Path $r).'(default)'
            if ($val -ne (Join-Path $App 'com.anysave.host.json')) {
              throw "Registry mismatch at $r : $val"
            }
          }

      - name: Run installed Windows helper E2E test (including live download, cancel & busy check)
        working-directory: host-go
        shell: pwsh
        run: |
          $HostExe = Join-Path $env:LOCALAPPDATA 'AnySave\anysave-host.exe'
          # Includes a real transcription with the installed speech engine (downloads the 252 MB model once).
          $Wav = Join-Path $env:RUNNER_TEMP 'jfk.wav'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav' -OutFile $Wav
          go run ./cmd/test-helper -bin $HostExe -live -transcribe $Wav -expect 'ask not what your country'

          # Test the installer's "busy" guard while a helper process is running
          $p = Start-Process -FilePath $HostExe -PassThru -WindowStyle Hidden
          try {
            $out = & pwsh -NoProfile -File ../dist/AnySave-windows/install.ps1 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0 -or $out -notmatch 'AnySave is busy') {
              throw "Expected installer to refuse when anysave-host.exe is running, got exit=$LASTEXITCODE out=$out"
            }
            Write-Host "[OK] Windows installer busy check refused cleanly while anysave-host.exe was running"
            $global:LASTEXITCODE = 0
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Run Windows uninstall.ps1 for real & verify everything is gone
        shell: pwsh
        run: |
          $Dl = Join-Path $env:USERPROFILE 'Downloads\AnySave\keep-me.txt'
          New-Item -ItemType Directory -Force -Path (Split-Path $Dl) | Out-Null
          Set-Content -Path $Dl -Value 'user file'
          & ./dist/AnySave-windows/uninstall.ps1 -Yes
          $App = Join-Path $env:LOCALAPPDATA 'AnySave'
          foreach ($p in @($App, (Join-Path $env:USERPROFILE 'AnySave\extension'),
              'HKCU:\Software\Google\Chrome\NativeMessagingHosts\com.anysave.host',
              'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\com.anysave.host',
              'HKCU:\Software\BraveSoftware\Brave-Browser\NativeMessagingHosts\com.anysave.host',
              'HKCU:\Software\Chromium\NativeMessagingHosts\com.anysave.host',
              'HKCU:\Software\Classes\anysave')) {
            if (Test-Path $p) { throw "Still there after uninstall: $p" }
          }
          if ((([Environment]::GetEnvironmentVariable('Path', 'User')) -split ';') -contains $App) { throw 'AnySave still in PATH' }
          if (-not (Test-Path $Dl)) { throw 'The uninstaller removed a downloaded file' }
          Write-Host '[OK] uninstall removed everything AnySave added and kept the downloads'
          $global:LASTEXITCODE = 0

  # ---------------------------------------------------------------------------
  # 3. macOS: Build universal zip, run install-mac.sh, helper E2E
  # ---------------------------------------------------------------------------
  macos-installer-and-helper:
    name: macOS (Real Installer + Helper E2E)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: host-go/go.mod

      - name: Build Desktop distribution via scripts/build.sh
        run: |
          ./scripts/build.sh
          ls -lh dist/
          test -f dist/AnySave-Desktop-Mac-Windows.zip
          test -f dist/AnySave-Mac.dmg
          test -f dist/AnySave-Setup.exe

      - name: Unzip & run Install AnySave.command for real
        env:
          ANYSAVE_NO_OPEN: "1"
        run: |
          TMP_DIR="$(mktemp -d)"
          unzip -q dist/AnySave-Desktop-Mac-Windows.zip -d "$TMP_DIR"
          bash "$TMP_DIR/AnySave-Desktop/AnySave-mac/Install AnySave.command"
          APP="$HOME/Library/Application Support/AnySave"
          test -x "$APP/anysave-host"
          test -x "$APP/bin/yt-dlp_app/yt-dlp_macos"
          test -x "$APP/bin/ffmpeg"
          test -x "$APP/bin/deno"
          test -f "$HOME/AnySave/extension/manifest.json"
          test -x "$APP/bin/whisper-cli"
          curl -sSL -o "$RUNNER_TEMP/jfk.wav" https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.5/samples/jfk.wav
          (cd host-go && go run ./cmd/test-helper -bin "$APP/anysave-host" -live -transcribe "$RUNNER_TEMP/jfk.wav" -expect "ask not what your country")
          # Uninstall for real, then check it's all gone and the downloads are kept.
          mkdir -p "$HOME/Downloads/AnySave" && echo keep > "$HOME/Downloads/AnySave/keep-me.txt"
          bash "$TMP_DIR/AnySave-Desktop/AnySave-mac/Uninstall AnySave.command" --yes
          test ! -e "$APP"
          test ! -e "$HOME/AnySave/extension"
          test ! -e "$HOME/Library/Application Support/Google/Chrome/NativeMessagingHosts/com.anysave.host.json"
          test -f "$HOME/Downloads/AnySave/keep-me.txt"
          echo "[OK] uninstall removed everything AnySave added and kept the downloads"
