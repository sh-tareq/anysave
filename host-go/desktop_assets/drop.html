<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AnySave Drop Box</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: rgba(24, 24, 28, 0.92);
      --fg: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #e5484d;
      --ok: #2f9e5b;
      --border: rgba(255, 255, 255, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      overflow: hidden;
    }
    .box {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 10px;
      border: 2px dashed var(--border);
      border-radius: 16px;
      transition: border-color 0.18s, background 0.18s, transform 0.15s;
      cursor: pointer;
    }
    .box.drag {
      border-color: var(--accent);
      background: rgba(229, 72, 77, 0.18);
      transform: scale(0.98);
    }
    .logo {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(145deg, #ff6369, #d9383e);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; color: #fff;
      box-shadow: 0 4px 12px rgba(229, 72, 77, 0.45);
      margin-bottom: 6px;
    }
    .title { font-size: 12px; font-weight: 600; line-height: 1.25; }
    .sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
    .bar {
      width: 86%; height: 5px;
      background: rgba(255, 255, 255, 0.14);
      border-radius: 99px; overflow: hidden;
      margin-top: 6px;
    }
    .bar > div {
      height: 100%; width: 0%;
      background: var(--accent);
      transition: width 0.25s ease;
    }
  </style>
</head>
<body>
  <div class="box" id="dropTarget" title="Drag any link here, or click to download your copied link">
    <div class="logo" id="badge">⬇</div>
    <div class="title" id="statusTitle">Drop Link Here</div>
    <div class="sub" id="statusSub">or click to paste</div>
    <div class="bar" id="progBar" hidden><div id="progFill"></div></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || localStorage.getItem("anysave_token") || "";
    const box = document.getElementById("dropTarget");
    const titleEl = document.getElementById("statusTitle");
    const subEl = document.getElementById("statusSub");
    const barEl = document.getElementById("progBar");
    const fillEl = document.getElementById("progFill");

    async function sendAction(payload) {
      const r = await fetch("/api/action", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-AnySave-Token": token },
        body: JSON.stringify(payload),
      });
      return r.json();
    }

    box.addEventListener("dragover", (e) => { e.preventDefault(); box.classList.add("drag"); });
    box.addEventListener("dragleave", () => box.classList.remove("drag"));
    box.addEventListener("drop", async (e) => {
      e.preventDefault();
      box.classList.remove("drag");
      const raw = e.dataTransfer?.getData("text/uri-list") || e.dataTransfer?.getData("text/plain") || "";
      if (!raw.trim()) return;
      titleEl.textContent = "Adding…";
      const res = await sendAction({ type: "addLink", url: raw.trim() });
      titleEl.textContent = res?.ok ? "Downloading ✓" : "Invalid link";
      setTimeout(refreshIdle, 2000);
    });

    box.addEventListener("click", async () => {
      titleEl.textContent = "Checking clipboard…";
      const res = await sendAction({ type: "downloadClipboard" });
      titleEl.textContent = res?.ok ? "Downloading ✓" : "No link copied";
      setTimeout(refreshIdle, 2000);
    });

    let activeCount = 0;
    function refreshIdle() {
      if (activeCount === 0) {
        titleEl.textContent = "Drop Link Here";
        subEl.textContent = "or click to paste";
        barEl.hidden = true;
      }
    }

    function updateJobs(jobs = {}) {
      const active = Object.values(jobs).filter((j) => ["starting", "downloading"].includes(j.status));
      activeCount = active.length;
      if (!active.length) {
        refreshIdle();
        return;
      }
      const pct = Math.max(0, Math.min(99, Math.round(active.reduce((a, j) => a + (j.percent || 0), 0) / active.length)));
      titleEl.textContent = `${active.length} active · ${pct}%`;
      subEl.textContent = active[0].speed || "Downloading…";
      barEl.hidden = false;
      fillEl.style.width = `${pct}%`;
    }

    const es = new EventSource(`/api/events?token=${encodeURIComponent(token)}`);
    es.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.jobs) updateJobs(d.jobs);
      } catch {}
    };
  </script>
</body>
</html>
